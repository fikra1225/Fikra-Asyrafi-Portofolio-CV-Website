<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standings — One On One Football</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="scoreboard-nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">One On One<span> Football</span></a>
      <nav>
        <a href="standings.html" class="active">Standings</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
      </nav>
    </div>
  </header>

  <main>
    <h2 id="standings-title">League Standings</h2>

    <form class="controls" id="standings-form">
      <div class="field">
        <label for="league">Competition</label>
        <select name="league" id="league"></select>
      </div>
      <div class="field">
        <label for="season">Season</label>
        <input type="text" name="season" id="season" style="min-width: 90px;" />
      </div>
      <button type="submit">Update</button>
    </form>

    <div id="notice"></div>
    <div id="table-wrap"></div>
  </main>

  <footer>
    One On One Football &middot; Data via API-Football &middot; Static build (HTML/CSS/JS)
  </footer>

  <script src="js/config.js"></script>
  <script src="js/leagues.js"></script>
  <script src="js/api.js"></script>
  <script src="js/standings.js"></script>
</body>
</html>
