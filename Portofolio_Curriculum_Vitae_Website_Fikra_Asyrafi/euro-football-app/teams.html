<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Search — One On One Football</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="scoreboard-nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">One On One<span> Football</span></a>
      <nav>
        <a href="standings.html">Standings</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="teams.html" class="active">Teams</a>
        <a href="players.html">Players</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>Team Search</h2>

    <form class="controls" id="teams-form">
      <div class="field">
        <label for="name">Team name</label>
        <input type="text" name="name" id="name" placeholder="e.g. Arsenal" />
      </div>
      <button type="submit">Search</button>
    </form>

    <div id="notice"></div>
    <div id="results" class="result-list"></div>
    <div id="recent-heading"></div>
    <div id="recent-fixtures" class="fixture-list"></div>
  </main>

  <footer>
    One On One Football &middot; Data via API-Football &middot; Static build (HTML/CSS/JS)
  </footer>

  <script src="js/config.js"></script>
  <script src="js/leagues.js"></script>
  <script src="js/api.js"></script>
  <script src="js/teams.js"></script>
</body>
</html>
